version: 1
disable_existing_loggers: false

formatters:
  json:
    format: "%(message)s"
  console:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

handlers:
  stdout:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: json

root:
  level: INFO
  handlers: [stdout]

loggers:
  fraud_risk_agent:
    level: INFO
    propagate: true
  uvicorn:
    level: WARNING
    propagate: true
  sqlalchemy.engine:
    level: WARNING
    propagate: true
