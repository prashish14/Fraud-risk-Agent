[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-risk-agent"
version = "0.1.0"
description = "AI agent for e-commerce fraud detection based on return and cancellation patterns"
requires-python = ">=3.12"
dependencies = [
    "langchain-core~=1.6.0",
    "langgraph~=1.2.0",
    "langchain-anthropic~=1.7.0",
    "langchain-postgres~=0.0.18",
    "langgraph-checkpoint-postgres~=3.1.0",
    "pgvector>=0.3.5,<0.4",
    "asyncpg~=0.31.0",
    "sqlalchemy[asyncio]~=2.0.50",
    "fastapi~=0.136.0",
    "uvicorn[standard]~=0.51.0",
    "pydantic~=2.13.0",
    "pydantic-settings~=2.14.0",
    "pyyaml>=6.0",
    "httpx~=0.28.0",
    "structlog>=24.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
    "alembic~=1.18.0",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-asyncio~=0.24",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: LLM evaluation tests (run with --run-eval)",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
